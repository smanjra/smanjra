name: Daily Prayer Scrape

on:
  schedule:
    - cron: '0 4 * * *' # Runs at 04:00 UTC every day
  workflow_dispatch: # Allows you to run it manually to test

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add prayer_times.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update prayer times" && git push)
