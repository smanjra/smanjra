<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Prayer Dashboard</title>
    <style>
        :root {
            --primary: #10b981;
            --danger: #ef4444;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --header-height: 110px; /* Calculated height of the sticky header */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
        }

        .container { max-width: 600px; margin: 0 auto; }

        /* HEADER */
        header {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            text-align: center;
            position: sticky;
            top: 10px; /* Slight gap from very top */
            z-index: 1000; /* Highest priority */
        }

        .prayer-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .nav-btn {
            background: #f1f5f9; border: none; font-size: 1.2rem; cursor: pointer;
            color: var(--text-sub); padding: 8px 18px; border-radius: 10px;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: var(--primary); color: white; }

        .current-prayer-title {
            font-size: 1.4rem; font-weight: 800; text-transform: uppercase;
            color: var(--primary); letter-spacing: 1px;
        }

        .sub-info { 
            font-size: 0.95rem; 
            color: var(--text-sub); 
            font-family: monospace;
            font-weight: 600;
        }

        /* LIST VIEW & STICKY TIME BADGE */
        .time-group { margin-bottom: 25px; }
        
        .time-header {
            display: flex; align-items: center; margin-bottom: 10px;
            position: sticky; 
            top: 115px; /* header-height + container gap */
            z-index: 900; 
        }
        
        .time-badge {
            background: var(--text-main); color: white;
            padding: 6px 14px; border-radius: 20px;
            font-weight: bold; font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .card {
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }

        .mosque-name { font-weight: 500; }
        .mosque-time { font-family: monospace; font-weight: 700; color: var(--primary); font-size: 1.1rem; }

        .card.passed { background-color: #fee2e2; opacity: 0.85; }
        .card.passed .mosque-name, .card.passed .mosque-time {
            color: var(--danger); text-decoration: line-through;
        }

        /* TABLE VIEW */
        .table-wrapper { 
            overflow-x: auto; background: white; 
            border-radius: 12px; padding: 10px; 
            display: none;
        }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        th { color: var(--text-sub); background: #f8fafc; }
        
        /* Highlight removed for table view as requested */

        .view-toggle {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: var(--text-main); color: white;
            padding: 12px 24px; border-radius: 30px;
            font-weight: 600; cursor: pointer; border: none;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            z-index: 2000;
        }
    </style>
</head>
<body>

<div class="container">
    <header id="mainHeader">
        <div class="prayer-nav">
            <button class="nav-btn" onclick="changePrayer(-1)">&#10094;</button>
            <div class="current-prayer-title" id="prayerTitle">ASR</div>
            <button class="nav-btn" onclick="changePrayer(1)">&#10095;</button>
        </div>
        <div class="sub-info" id="statusTime">00:00:00</div>
    </header>

    <div id="listView"></div>

    <div id="tableView" class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Masjid</th>
                    <th>Fajr</th>
                    <th>Zohar</th>
                    <th>Asr</th>
                    <th>Maghrib</th>
                    <th>Eisha</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <button class="view-toggle" onclick="toggleView()">Show Full Timetable</button>
</div>

<script>
    const GITHUB_USERNAME = 'smanjra'; // Update this!
    const REPO_NAME = 'smanjra';
    
    const PRAYERS = ['fajr', 'zohar', 'asr', 'maghrib', 'eisha'];
    let currentPrayerIndex = 2;
    let allData = [];
    let isListView = true;

    async function init() {
        autoDetectPrayer();
        await loadData();
        render();
        // Update seconds every second
        setInterval(updateClock, 1000);
        // Full refresh every minute
        setInterval(render, 60000); 
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('statusTime').innerText = now.toLocaleTimeString();
    }

    function autoDetectPrayer() {
        const hour = new Date().getHours();
        if (hour < 7) currentPrayerIndex = 0;
        else if (hour < 13) currentPrayerIndex = 1;
        else if (hour < 16) currentPrayerIndex = 2;
        else if (hour < 19) currentPrayerIndex = 3;
        else currentPrayerIndex = 4;
    }

    async function loadData() {
        try {
            const url = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/prayer_times.json`;
            const res = await fetch(url);
            allData = await res.json();
            allData.sort((a, b) => a.name.localeCompare(b.name));
        } catch (e) { console.error(e); }
    }

    function getMinutes(t) {
        if (!t || !t.includes(':')) return 9999;
        const [h, m] = t.split(':').map(Number);
        return h * 60 + m;
    }

    function render() {
        const prayerName = PRAYERS[currentPrayerIndex];
        document.getElementById('prayerTitle').innerText = prayerName;
        updateClock();

        if (isListView) {
            renderList(prayerName);
        } else {
            renderTable();
        }
    }

    function renderList(prayerName) {
        const container = document.getElementById('listView');
        container.style.display = 'block';
        document.getElementById('tableView').style.display = 'none';
        container.innerHTML = '';

        const nowMins = new Date().getHours() * 60 + new Date().getMinutes();
        const list = allData.map(m => ({
            name: m.name,
            timeStr: m[prayerName],
            minutes: getMinutes(m[prayerName])
        })).filter(m => m.minutes < 1440).sort((a, b) => a.minutes - b.minutes);

        const grouped = {};
        list.forEach(i => {
            if(!grouped[i.timeStr]) grouped[i.timeStr] = [];
            grouped[i.timeStr].push(i);
        });

        Object.keys(grouped).forEach(time => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'time-group';
            groupDiv.innerHTML = `<div class="time-header"><span class="time-badge">${time}</span></div>`;

            grouped[time].forEach(m => {
                const isPassed = m.minutes < nowMins;
                const card = document.createElement('div');
                card.className = `card ${isPassed ? 'passed' : ''}`;
                card.innerHTML = `<span class="mosque-name">${m.name}</span><span class="mosque-time">${m.timeStr}</span>`;
                groupDiv.appendChild(card);
            });
            container.appendChild(groupDiv);
        });
    }

    function renderTable() {
        const container = document.getElementById('tableView');
        const tbody = document.getElementById('tableBody');
        container.style.display = 'block';
        document.getElementById('listView').style.display = 'none';
        tbody.innerHTML = '';

        allData.forEach(m => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><b>${m.name}</b></td><td>${m.fajr}</td><td>${m.zohar}</td><td>${m.asr}</td><td>${m.maghrib}</td><td>${m.eisha}</td>`;
            tbody.appendChild(tr);
        });
    }

    function changePrayer(n) {
        currentPrayerIndex = (currentPrayerIndex + n + 5) % 5;
        render();
    }

    function toggleView() {
        isListView = !isListView;
        document.querySelector('.view-toggle').innerText = isListView ? "Show Full Timetable" : "Show List View";
        render();
    }

    init();
</script>
</body>
</html>
